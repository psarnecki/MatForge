<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competition (phone)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;background:#F2F2F2;color:#191919;font-family:'Barlow',sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{background:#000;color:#fff;height:56px;display:flex;align-items:center;gap:8px;padding:0 8px;flex:none}
.bar a{color:#fff;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.bar h1{font:700 24px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
label,.lb{font-size:13px;font-weight:600;color:#585B63;display:block;margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{width:100%;height:44px;box-sizing:border-box;border:1px solid #D5D6D8;background:#fff;padding:0 12px;font:500 15px 'Barlow',sans-serif;color:#191919;border-radius:2px}
.seg{display:flex;border:1px solid #D5D6D8;background:#fff}
.seg button{flex:1;height:44px;border:0;border-right:1px solid #D5D6D8;background:none;font:500 15px 'Barlow',sans-serif;color:#585B63}
.seg button:last-child{border:0}.seg .on{background:#191919;color:#fff}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big button{height:56px;border:2px solid #191919;background:#fff;font:700 22px 'Barlow Condensed',sans-serif;text-transform:uppercase;color:#191919}
.big .w{border-color:#1F7A4A;color:#1F7A4A}.big .l{border-color:#D20A0A;color:#D20A0A}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 12px;border:1px solid #D5D6D8;background:#fff;font:500 14px 'Barlow',sans-serif;color:#191919;display:flex;align-items:center;gap:8px}
.chip i{width:8px;height:8px;display:block}
.sum{font-size:14px;color:#585B63;margin:0}
.save{flex:none;padding:12px 16px 20px;border-top:1px solid #D5D6D8}
.save button{width:100%;height:52px;background:#D20A0A;color:#fff;border:0;font:700 20px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em}

.plc{display:grid;grid-template-columns:repeat(3,1fr) 72px;gap:8px}
.plc button{height:44px;border:1px solid #D5D6D8;background:#fff;font:600 15px 'Barlow',sans-serif;color:#191919}
.plc .on{background:#191919;color:#fff;border-color:#191919}
.ttl{font:700 28px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0}
.m2{font-size:14px;color:#585B63;line-height:1.5;margin:4px 0 0}
.fi{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #D5D6D8}
.fi b{font-size:15px}.fi span{font-size:13px;color:#585B63;display:block}
.fi .n{font:700 20px 'Barlow Condensed',sans-serif;color:#191919}
.rs{font:700 18px 'Barlow Condensed',sans-serif;text-transform:uppercase}.rs.w{color:#1F7A4A}.rs.l{color:#D20A0A}
.add{height:44px;border:1px solid #191919;background:#fff;font:700 16px 'Barlow Condensed',sans-serif;text-transform:uppercase;color:#191919}
</style>
</head>
<body>
<div class="ph">
<header class="bar"><a href="#" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1>Competition</h1></header>
<div class="body">
<div><h2 class="ttl">Warsaw Open</h2><p class="m2">12 Sep 2026, Warsaw<br>BJJ No-Gi, Adult, Blue belt, -82.3 kg</p></div>
<div><span class="lb">Result</span><div class="plc"><button>Gold</button><button class="on">Silver</button><button>Bronze</button><input aria-label="Place" value="2"></div></div>
<div><label for="n">Note</label><input id="n" value="Lost in the final"></div>
<div><span class="lb">Fights (3)</span>
<div class="fi"><span class="n">1</span><div><b>J. Kowalski</b><span>Submission, Rear Naked Choke</span></div><div style="text-align:right"><div class="rs w">Win</div><span>3:32</span></div></div>
<div class="fi"><span class="n">2</span><div><b>M. Nowak</b><span>Points</span></div><div style="text-align:right"><div class="rs w">Win</div><span>6:00</span></div></div>
<div class="fi"><span class="n">3</span><div><b>T. Wisniewski</b><span>Submission, Triangle Choke</span></div><div style="text-align:right"><div class="rs l">Loss</div><span>2:10</span></div></div></div>
<button class="add">Add fight</button>
</div>
<div class="save"><button>Save competition</button></div>
</div>
</body>
</html>
