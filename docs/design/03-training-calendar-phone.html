<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training calendar (phone)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;background:#F2F2F2;color:#191919;font-family:'Barlow',sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{background:#000;color:#fff;height:56px;display:flex;align-items:center;gap:8px;padding:0 8px;flex:none}
.bar a{color:#fff;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.bar h1{font:700 24px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
label,.lb{font-size:13px;font-weight:600;color:#585B63;display:block;margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{width:100%;height:44px;box-sizing:border-box;border:1px solid #D5D6D8;background:#fff;padding:0 12px;font:500 15px 'Barlow',sans-serif;color:#191919;border-radius:2px}
.seg{display:flex;border:1px solid #D5D6D8;background:#fff}
.seg button{flex:1;height:44px;border:0;border-right:1px solid #D5D6D8;background:none;font:500 15px 'Barlow',sans-serif;color:#585B63}
.seg button:last-child{border:0}.seg .on{background:#191919;color:#fff}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big button{height:56px;border:2px solid #191919;background:#fff;font:700 22px 'Barlow Condensed',sans-serif;text-transform:uppercase;color:#191919}
.big .w{border-color:#1F7A4A;color:#1F7A4A}.big .l{border-color:#D20A0A;color:#D20A0A}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 12px;border:1px solid #D5D6D8;background:#fff;font:500 14px 'Barlow',sans-serif;color:#191919;display:flex;align-items:center;gap:8px}
.chip i{width:8px;height:8px;display:block}
.sum{font-size:14px;color:#585B63;margin:0}
.save{flex:none;padding:12px 16px 20px;border-top:1px solid #D5D6D8}
.save button{width:100%;height:52px;background:#D20A0A;color:#fff;border:0;font:700 20px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em}

.mh{display:flex;align-items:center;justify-content:space-between}
.mh h2{font:700 24px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0}
.mh button{width:44px;height:44px;border:1px solid #D5D6D8;background:#fff;font:600 18px 'Barlow',sans-serif}
.wd,.gr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wd span{font-size:12px;font-weight:600;color:#585B63;padding:4px 0}
.gr button{height:44px;border:0;background:none;font:500 15px 'Barlow',sans-serif;color:#191919;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.gr .o{color:#ABADB1}.gr .sel{background:#191919;color:#fff}.gr .today{outline:2px solid #D20A0A;outline-offset:-3px}
.mk{display:flex;gap:3px;height:6px}.mk i{width:6px;height:6px;background:#D20A0A}.mk i.x{background:#6B6E75}
.day h3{font:700 20px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:4px 0 6px}
.it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #D5D6D8}
.it b{display:block;font-size:16px}.it span{font-size:14px;color:#585B63}
.it em{font:700 22px 'Barlow Condensed',sans-serif;font-style:normal}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#000;height:56px}
.tabs a{color:#ABADB1;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none;border-top:3px solid transparent}
.tabs a.on{color:#fff;border-color:#D20A0A}
</style>
</head>
<body>
<div class="ph">
<header class="bar"><h1 style="margin-left:8px">Training</h1></header>
<div class="body">

tton class="">31<span class="mk"></span></button><button class="o">1<span class="mk"></span></button></div></div>

</div>
<div class="save"><button>Log training</button></div>
<nav class="tabs" aria-label="Main"><a href="#">Dashboard</a><a class="on" href="#">Training</a><a href="#">Competitions</a><a href="#">Goals</a><a href="#">More</a></nav>
</div>
</body>
</html>
